name: DNS Benchmark (Windows app)

# Tests the DNS Benchmark tool on real Windows and builds the standalone .exe files.
# Download them from the run's "Artifacts" section.
on:
  push:
    paths: ["tools/dns_benchmark/**", ".github/workflows/dns-benchmark.yml"]
  pull_request:
    paths: ["tools/dns_benchmark/**", ".github/workflows/dns-benchmark.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/dns_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dns_benchmark/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Real network detection on Windows (PowerShell cmdlets)
        run: python -c "from dnsbench.network import detect_network; n = detect_network(); print(n.snapshot()); assert n.error is None, n.error; assert n.dns_servers"
      - name: Real benchmark smoke test (network-dependent, informational)
        continue-on-error: true
        run: python run.py --cli --mode quick --no-save --export ci-result.txt
      - name: Build executables
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/DNSBenchmark.spec
      - name: Smoke-test the built CLI exe
        run: dist/DNSBenchmark-cli.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: DNSBenchmark-windows
          path: |
            tools/dns_benchmark/dist/DNSBenchmark.exe
            tools/dns_benchmark/dist/DNSBenchmark-cli.exe
            tools/dns_benchmark/ci-result.txt
          if-no-files-found: warn
