name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Supabase Edge Functions are Deno code: type-check them too.
      - run: npx --yes deno@2 check supabase/functions/claude/index.ts supabase/functions/wearables/index.ts supabase/functions/push/index.ts
