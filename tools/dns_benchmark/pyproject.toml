[project]
name = "dns-benchmark"
version = "1.0.0"
description = "Find the fastest, most reliable DNS server for your own internet connection (Windows desktop app)."
requires-python = ">=3.10"
dependencies = ["dnspython>=2.6,<3", "PySide6>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
